name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      CAPFIND_CHECKOUT: ${{ github.workspace }}/.integration/local-capability-finder
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout pinned Finder Contract v1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: BlguunBN/local-capability-finder
          ref: 41410a108bb78d0ca36b3134d87f73b2bd0b74b7
          path: .integration/local-capability-finder
          persist-credentials: false
      - name: Validate Stack manifest
        run: python -m stack_manifest
      - name: Lint all canonical skills
        run: python scripts/lint_skills.py
      - name: Evaluate routing
        run: python scripts/evaluate_routing.py
      - name: Validate bounded handoff
        run: python scripts/validate_handoff.py --handoff delegation/examples/worker-handoff.json
      - name: Unit and live MCP contract tests
        run: python -m unittest discover -s tests -v
